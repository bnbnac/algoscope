<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KD-tree 3D — algo-viz</title>
  </head>
  <body>
    <main style="max-width: 900px; margin: 2rem auto; font-family: system-ui, sans-serif; padding: 0 1rem;">
      <h1>KD-tree (3D)</h1>
      <p>
        3D 점을 삽입하며 분할면이 재귀적으로 생기는 과정과 NN 쿼리의 back-track을 시각화합니다.
        마우스로 드래그하면 회전, 휠로 확대/축소할 수 있습니다. 클릭 배치 대신 좌표를 직접
        입력해 점을 추가하세요.
      </p>
      <div style="max-width: 800px; width: 100%; aspect-ratio: 1 / 1">
        <canvas
          id="kdtree-canvas"
          width="800"
          height="800"
          style="width: 100%; height: 100%; display: block; border: 1px solid #ccc"
        ></canvas>
      </div>
      <div id="kdtree-input-editor" style="margin: 1rem 0"></div>
      <div id="kdtree-shell"></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
