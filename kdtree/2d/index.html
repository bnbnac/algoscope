<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KD-tree 2D — algo-viz</title>
  </head>
  <body>
    <main style="max-width: 900px; margin: 2rem auto; font-family: system-ui, sans-serif; padding: 0 1rem;">
      <h1>KD-tree (2D)</h1>
      <p>
        점을 순서대로 삽입하며 축 분할선이 재귀적으로 그려지는 과정과, 최근접 이웃(NN) 쿼리
        시 back-track되는 노드를 시각화합니다. 재생 버튼으로 삽입 과정을 재생하거나, 스크러버로
        원하는 스텝을 직접 확인하세요. 점에 마우스를 올리면 좌표가 표시됩니다.
      </p>
      <div style="max-width: 800px; width: 100%; aspect-ratio: 4 / 3">
        <canvas
          id="kdtree-canvas"
          width="800"
          height="600"
          style="width: 100%; height: 100%; display: block; border: 1px solid #ccc"
        ></canvas>
      </div>
      <div id="kdtree-input-editor" style="margin: 1rem 0"></div>
      <div id="kdtree-shell"></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
